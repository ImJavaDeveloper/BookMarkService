spring.application.name=bookmark-service
server.port=8082
#spring.data.mongodb.uri=mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=2000
spring.data.mongodb.uri=${DATASOURCE_URL}

eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.client.register-with-eureka= true
eureka.client.fetch-registry: true

# SpringDoc configurations
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/doc/swagger-ui.html
